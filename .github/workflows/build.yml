name: Build devcontainer base

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"  # weekly, to pick up package updates
  workflow_dispatch:

permissions:
  contents: write  # release creation for build notifications
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/r-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Weekly no-cache rebuilds always produce a new digest even when no
      # versions changed, so the digest alone can't tell us whether a build
      # is meaningful. Instead, snapshot tool versions (Claude Code, Quarto,
      # gh, Node, R, ...) plus installed R packages from the previously
      # published image and diff against the new one. Debian packages are
      # snapshotted too but only shown in release notes, never a trigger —
      # see .github/scripts/manifest.sh.
      - name: Snapshot published versions
        run: |
          mkdir -p /tmp/before /tmp/after
          if docker pull --quiet "$IMAGE:latest"; then
            docker run --rm \
              -v "$PWD/.github/scripts:/scripts:ro" -v /tmp/before:/out \
              "$IMAGE:latest" bash /scripts/manifest.sh /out
            docker image rm "$IMAGE:latest"
          else
            : > /tmp/before/signal.txt
            : > /tmp/before/system.txt
          fi

      # push: never — with push: always the action defers the push to its
      # post-run step, which executes AFTER the steps below. The compare
      # step's old `docker pull` then re-tagged :latest back to the previous
      # registry image, so the diff saw nothing and the post-run step
      # re-published the OLD image, silently discarding the new build.
      #
      # Up to three attempts: several features (docker-outside-of-docker,
      # quarto-cli, ...) fetch GitHub release assets with `curl` lacking -f,
      # so a transient 504 from GitHub is saved as the download and fails
      # whichever feature hit it. Only the last attempt can fail the job.
      - name: Build image
        id: build1
        uses: devcontainers/ci@v0.3
        continue-on-error: true
        with: &build-inputs
          imageName: ghcr.io/${{ github.repository_owner }}/r-base
          cacheFrom: ghcr.io/${{ github.repository_owner }}/r-base
          push: never
          noCache: ${{ github.event_name != 'push' }}

      - name: Build image (retry 1)
        id: build2
        if: steps.build1.outcome == 'failure'
        uses: devcontainers/ci@v0.3
        continue-on-error: true
        with: *build-inputs

      - name: Build image (retry 2)
        if: steps.build2.outcome == 'failure'
        uses: devcontainers/ci@v0.3
        with: *build-inputs

      - name: Push image
        run: docker push "$IMAGE:latest"

      # No docker pull here: the freshly built image is already the local
      # :latest, and pulling would re-tag it back to the registry version.
      - name: Compare against new image
        id: diff
        run: |
          docker run --rm \
            -v "$PWD/.github/scripts:/scripts:ro" -v /tmp/after:/out \
            "$IMAGE:latest" bash /scripts/manifest.sh /out
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")" >> "$GITHUB_OUTPUT"
          if diff -u /tmp/before/signal.txt /tmp/after/signal.txt > /tmp/signal.diff; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          diff -u /tmp/before/system.txt /tmp/after/system.txt > /tmp/system.diff || true

      # A release both notifies watchers and records the digest for pinning.
      - name: Create release for changed build
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          {
            echo "New image: \`${{ steps.diff.outputs.digest }}\`"
            echo
            echo "Tool and R package changes since the previous build:"
            echo '```diff'
            cat /tmp/signal.diff
            echo '```'
            echo
            echo '<details><summary>System (Debian) package changes</summary>'
            echo
            echo '```diff'
            if [ -s /tmp/system.diff ]; then
              head -300 /tmp/system.diff
              if [ "$(wc -l < /tmp/system.diff)" -gt 300 ]; then
                echo "... truncated ($(wc -l < /tmp/system.diff) lines total)"
              fi
            else
              echo "none"
            fi
            echo '```'
            echo
            echo '</details>'
          } > /tmp/notes.md
          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
